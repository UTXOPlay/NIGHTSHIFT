services:
  nightshift:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: utxoplay/nightshift:12.0.0
    restart: unless-stopped
    environment:
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:?Set a stable server-only token of at least 32 characters}
      GAME_ORIGIN: ${GAME_ORIGIN:-http://localhost:8898}
    ports:
      - "127.0.0.1:8898:8080"
    volumes:
      - nightshift-v8:/app/data
      - nightshift-v9:/app/data-v9
      - nightshift-v10:/app/data-v10
      - nightshift-v11:/app/data-v11
      - nightshift-v12:/app/data-v12
volumes:
  nightshift-v8:
  nightshift-v9:
  nightshift-v10:
  nightshift-v11:
  nightshift-v12:
